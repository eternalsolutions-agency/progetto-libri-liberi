<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Attiva piano | Progetto Libri Liberi</title><link rel="stylesheet" href="assets/style.css"><style>
.pay-shell{max-width:760px;margin:auto}.pay-card{padding:28px}.pay-options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.pay-option{border:1px solid #ddcfbf;border-radius:14px;padding:16px;cursor:pointer;background:#fff}.pay-option.active{outline:2px solid #89532f;background:#fff9f1}.pay-status{margin-top:15px;font-weight:700}@media(max-width:650px){.pay-options{grid-template-columns:1fr}}
</style></head><body><div data-include="_nav.html"></div><main class="section"><div class="container pay-shell"><section class="card pay-card"><span class="eyebrow dark">Attivazione abbonamento</span><h1 id="title">Completa il tuo piano</h1><p id="intro">Verifica account…</p><div id="billing" class="pay-options" hidden><div class="pay-option active" data-cycle="mensile"><strong id="monthly"></strong><small>Mensile</small></div><div class="pay-option" data-cycle="annuale"><strong id="annual"></strong><small>Annuale</small></div></div><div id="paypalButton"></div><div id="status" class="pay-status"></div></section></div></main><div data-include="_footer.html"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const U='https://axudbwobzmmrqpdnbamp.supabase.co',K='sb_publishable_JHJBoonYn5HFxERyv-RWKA_oKpYsV7W',db=supabase.createClient(U,K);
const prices={sostenitore:{mensile:'€3,99',annuale:'€39,90'},partner:{mensile:'€19,90',annuale:'€189'},sponsor:{mensile:'€49,90',annuale:'€489'}};
let session,kind,cycle='mensile',cfg;
function loadSdk(){return new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://www.paypal.com/sdk/js?client-id='+encodeURIComponent(cfg.client_id)+'&vault=true&intent=subscription&currency=EUR';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
function render(){paypalButton.innerHTML='';const key=kind+'-'+cycle,planId=cfg.plans[key];paypal.Buttons({style:{shape:'rect',label:'subscribe'},createSubscription:(data,actions)=>actions.subscription.create({plan_id:planId,custom_id:session.user.id}),onApprove:async data=>{status.textContent='Verifica abbonamento…';const r=await fetch('/api/paypal-subscription-record',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({subscription_id:data.subscriptionID})});const d=await r.json();if(!r.ok){status.textContent=d.message||'Errore durante l’attivazione.';return}status.textContent='Abbonamento attivato. Ti portiamo nella tua area riservata…';setTimeout(()=>location.href='area-riservata.html',1200)},onError:()=>status.textContent='PayPal non ha completato l’operazione.'}).render('#paypalButton')}
(async()=>{const s=await db.auth.getSession();session=s.data.session;if(!session){location.href='accedi.html';return}const meta=session.user.user_metadata||{};const p=await db.from('profili').select('*').eq('id',session.user.id).maybeSingle();if(p.data?.piano&&p.data.piano!=='gratis'&&p.data.stato==='attivo'){location.href='area-riservata.html';return}kind=meta.piano_richiesto;if(!['sostenitore','partner','sponsor'].includes(kind))kind=new URLSearchParams(location.search).get('piano');if(!['sostenitore','partner','sponsor'].includes(kind)){intro.textContent='Non risulta un piano a pagamento da attivare.';return}title.textContent='Attiva '+kind.charAt(0).toUpperCase()+kind.slice(1);intro.textContent='Scegli mensile o annuale e completa l’abbonamento con PayPal.';monthly.textContent=prices[kind].mensile;annual.textContent=prices[kind].annuale;billing.hidden=false;document.querySelectorAll('.pay-option').forEach(x=>x.onclick=()=>{document.querySelectorAll('.pay-option').forEach(y=>y.classList.remove('active'));x.classList.add('active');cycle=x.dataset.cycle;render()});const r=await fetch('/api/paypal-config');cfg=await r.json();if(!r.ok||!cfg.ok){status.textContent=cfg.message||'Configurazione PayPal non disponibile.';return}await loadSdk();render()})();
</script><script src="assets/script.js"></script></body></html>
