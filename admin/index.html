<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Back Office | Progetto Libri Liberi</title><link rel="stylesheet" href="../assets/style.css"><link rel="stylesheet" href="admin.css"><style>
.payments-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}
.payments-summary>div{background:#fff;border:1px solid #e3ece6;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:3px}
.payments-summary strong{font-size:1.25rem}.payments-summary span{font-size:.78rem;opacity:.68}
.payments-toolbar{display:flex;gap:10px;margin:0 0 14px}.payments-toolbar select{padding:10px 12px;border:1px solid #d8e4dc;border-radius:10px;background:#fff}
.payment-row small{display:block;margin-top:6px;opacity:.68}.payment-email{margin:2px 0 6px!important}
.payment-status{text-transform:capitalize;padding:7px 10px;border-radius:999px;background:#eef3ef;white-space:nowrap}
.status-attivo{background:#e5f6ea}.status-cancellato,.status-pagamento_fallito{background:#fdebea}.status-sospeso{background:#fff4dc}
@media(max-width:760px){.payments-summary{grid-template-columns:1fr 1fr}.payments-toolbar{flex-direction:column}.payment-row{align-items:flex-start!important}}
</style></head><body class="admin-body"><main class="admin-shell"><section id="loginView" class="admin-login"><img src="../assets/img/logo.png" alt="Progetto Libri Liberi"><h1>Back Office</h1><p>Accedi all'area riservata.</p><form id="loginForm"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button class="btn btn-primary" type="submit">Accedi</button><div id="loginStatus" class="form-status"></div></form></section><section id="dashboardView" hidden><header class="admin-top"><div><span class="eyebrow dark">Area riservata</span><h1>Progetto Libri Liberi</h1></div><button id="logoutBtn" class="btn btn-blue">Esci</button></header><nav class="admin-tabs"><button data-tab="richieste" class="active">Richieste</button><button data-tab="galleria">Galleria</button><button data-tab="pagamenti">Pagamenti</button></nav><section id="richieste" class="admin-panel active"><div class="admin-heading"><div><h2>Richieste</h2><p>Candidature, contatti, casette, adesioni, partner e sponsor.</p></div><button class="btn btn-blue" data-refresh="richieste">Aggiorna</button></div><div id="requestsList" class="admin-list"></div></section><section id="galleria" class="admin-panel"><div class="admin-heading"><div><h2>Galleria</h2><p>Carica e gestisci le immagini pubblicate sul sito.</p></div></div><form id="galleryForm" class="admin-form"><input id="galleryTitle" placeholder="Titolo"><input id="galleryLocation" placeholder="Località"><textarea id="galleryDescription" placeholder="Descrizione"></textarea><input id="galleryFile" type="file" accept="image/jpeg,image/png,image/webp" required><label><input id="galleryPublished" type="checkbox" checked> Pubblica subito</label><button class="btn btn-primary" type="submit">Carica immagine</button><div id="galleryStatus" class="form-status"></div></form><div id="galleryList" class="admin-gallery"></div></section><section id="pagamenti" class="admin-panel"><div class="admin-heading"><div><h2>Pagamenti</h2><p>Stato degli abbonamenti e dei pagamenti registrati.</p></div><button class="btn btn-blue" data-refresh="pagamenti">Aggiorna</button></div><div id="paymentsSummary" class="payments-summary"></div><div class="payments-toolbar"><select id="paymentTypeFilter"><option value="tutti">Tutti i tipi</option><option value="sostenitore">Sostenitori</option><option value="partner">Partner</option><option value="sponsor">Sponsor</option></select><select id="paymentStatusFilter"><option value="tutti">Tutti gli stati</option><option value="attivo">Attivi</option><option value="cancellato">Cancellati</option><option value="sospeso">Sospesi</option><option value="pagamento_fallito">Pagamento fallito</option><option value="scaduto">Scaduti</option></select></div><div id="paymentsList" class="admin-list"></div></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script></body></html>
